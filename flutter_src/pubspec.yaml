name: photo_album
description: "Personal photo album for Android (date + folder views)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.6.0
  photo_manager_image_provider: ^2.2.0
  pro_image_editor: ^13.3.1
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App 圖示：把一張 1024x1024 的 PNG 放到 assets/icon/logo.png，
# 雲端 build 會自動用它產生所有尺寸的 App 圖示。
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo.png"
  min_sdk_android: 21
