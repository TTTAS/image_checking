name: photo_album
description: "Personal photo album for Android (date + folder views)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.6.0
  photo_manager_image_provider: ^2.2.0
  pro_image_editor: ^13.3.1
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App 圖示：
#   - logo.png            : 一般（legacy）圖示用的完整圖，山豬置中留白。
#   - logo_foreground.png : 自適應圖示（adaptive icon）專用前景，山豬已放大填滿約
#                           82%，用來抵銷 Android 安全區的縮放，避免山豬被縮太小。
# 雲端 build 會自動用它們產生所有尺寸的 App 圖示。
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  # 背景改成和圖片相同的綠色，adaptive icon 邊緣才不會露出白邊。
  adaptive_icon_background: "#B6E3CE"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
  min_sdk_android: 21
