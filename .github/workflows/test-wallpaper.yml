name: Test wallpaper rendering
on:
  push:
    branches: [codex/video-wallpaper-playlists]
  pull_request:
    paths: ['flutter_src/native/**', 'native_tests/**', '.github/workflows/test-wallpaper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble native regression app and video fixture
        run: |
          for name in PlaylistWallpaperService WallpaperRenderer; do
            sed 's/__PACKAGE__/com.tttas.wallpapertest/g' "flutter_src/native/$name.kt" > "native_tests/app/src/main/java/com/tttas/wallpapertest/$name.kt"
          done
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p native_tests/app/src/androidTest/assets
          ffmpeg -f lavfi -i testsrc2=size=320x180:rate=15 -t 4 -c:v libx264 -pix_fmt yuv420p native_tests/app/src/androidTest/assets/test.mp4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify decoded frames, framing, mixed playlist, and engine recreation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle -p native_tests connectedDebugAndroidTest --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-rendering-results
          path: |
            native_tests/app/build/reports/androidTests
            native_tests/app/build/outputs/androidTest-results
