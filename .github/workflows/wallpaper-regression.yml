name: Wallpaper runtime regression
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['flutter_src/**', 'tests/wallpaper/**', '.github/workflows/wallpaper-regression.yml']
  pull_request:
    paths: ['flutter_src/**', 'tests/wallpaper/**', '.github/workflows/wallpaper-regression.yml']
permissions:
  contents: read
jobs:
  android-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare production code and generated media
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 tests/wallpaper/prepare.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile instrumentation
        run: gradle -p tests/wallpaper assembleDebug assembleDebugAndroidTest
      - name: Test actual Surface pixels and playback lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash tests/wallpaper/run_emulator_tests.sh
      - name: Upload pixel evidence and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallpaper-runtime-evidence
          path: |
            tests/wallpaper/app/build/reports/androidTests
            tests/wallpaper/app/build/outputs/androidTest-results
            tests/wallpaper/evidence
            tests/wallpaper/playback.log
            tests/wallpaper/instrumentation.txt
