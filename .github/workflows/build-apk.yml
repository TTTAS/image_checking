name: Build APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - feat/video-wallpaper-playlist

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Assemble Flutter project from flutter_src
        run: |
          flutter create --platforms=android --project-name photoalbum --org com.tttas .
          cp flutter_src/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r flutter_src/lib lib
          if [ -d flutter_src/assets ]; then mkdir -p assets && cp -r flutter_src/assets/. assets/; fi

      - name: Inject photo-library permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's/(<manifest[^>]*>)/$1\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" \/>\n    <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION" \/>\n    <uses-permission android:name="android.permission.SET_WALLPAPER" \/>/' "$MANIFEST"
          grep -q 'xmlns:tools' "$MANIFEST" || sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MANIFEST"
          sed -i 's|[$]{applicationName}|.PhotoApplication|g' "$MANIFEST"
          grep -q 'WorkManagerInitializer' "$MANIFEST" || perl -0pi -e 's/(<\/application>)/        <provider android:name="androidx.startup.InitializationProvider" android:authorities="\${applicationId}.androidx-startup" android:exported="false" tools:node="merge">\n            <meta-data android:name="androidx.work.WorkManagerInitializer" tools:node="remove" \/>\n        <\/provider>\n    $1/' "$MANIFEST"
          grep -q 'PlaylistWallpaperService' "$MANIFEST" || perl -0pi -e 's/(<\/application>)/        <service android:name=".PlaylistWallpaperService" android:exported="true" android:label="\@string\/playlist_wallpaper_label" android:permission="android.permission.BIND_WALLPAPER">\n            <intent-filter>\n                <action android:name="android.service.wallpaper.WallpaperService" \/>\n            <\/intent-filter>\n            <meta-data android:name="android.service.wallpaper" android:resource="\@xml\/playlist_wallpaper" \/>\n        <\/service>\n    $1/' "$MANIFEST"

      - name: Inject native Kotlin code
        run: |
          GEN=$(find android/app/src/main -name MainActivity.kt | head -1)
          PKG=$(grep -m1 '^package ' "$GEN" | sed 's/^package //; s/[[:space:]]*$//')
          PKGDIR=$(dirname "$GEN")
          for kt in flutter_src/native/*.kt; do
            name=$(basename "$kt")
            sed "s/__PACKAGE__/$PKG/" "$kt" > "$PKGDIR/$name"
          done
          if [ -d flutter_src/native/res ]; then
            mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
            cp flutter_src/native/res/xml/*.xml android/app/src/main/res/xml/ 2>/dev/null || true
            cp flutter_src/native/res/values/*.xml android/app/src/main/res/values/ 2>/dev/null || true
          fi

      - name: Inject WorkManager dependency
        run: |
          APP_GRADLE=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          cp flutter_src/native/proguard-rules.pro android/app/proguard-rules.pro
          if grep -q 'work-runtime' "$APP_GRADLE"; then
            echo "work dep already present"
          elif [[ "$APP_GRADLE" == *.kts ]]; then
            printf '\ndependencies {\n    implementation("androidx.work:work-runtime-ktx:2.9.1")\n}\n' >> "$APP_GRADLE"
          else
            printf '\ndependencies {\n    implementation "androidx.work:work-runtime-ktx:2.9.1"\n}\n' >> "$APP_GRADLE"
          fi

      - name: Install Play upload keystore and patch Gradle
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Missing upload keystore GitHub secrets"
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          python3 flutter_src/native/patch_play_signing.py

      - name: Build release APK and AAB
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/wallpaper*.dart lib/src/viewer.dart lib/src/native_wallpaper.dart
          flutter test flutter_src/test/wallpaper_ui_test.dart
          if [ -f assets/icon/logo.png ]; then
            dart run flutter_launcher_icons
          fi
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photo_album_apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: photo_album_aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish APK and AAB to a Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest build (APK + AAB)
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          prerelease: true
