name: Build APK

# 手動觸發，或每次 push 都自動 build
on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'claude/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建立 Release 需要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Assemble Flutter project from flutter_src
        run: |
          flutter create --platforms=android --project-name photo_album --org com.example.photoalbum .
          cp flutter_src/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r flutter_src/lib lib
          if [ -d flutter_src/assets ]; then mkdir -p assets && cp -r flutter_src/assets/. assets/; fi

      - name: Inject photo-library permissions
        run: |
          perl -0pi -e 's/(<manifest[^>]*>)/$1\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" \/>\n    <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION" \/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.SET_WALLPAPER" \/>/' android/app/src/main/AndroidManifest.xml
          echo "----- AndroidManifest.xml -----"
          cat android/app/src/main/AndroidManifest.xml

      - name: Inject native folder-rename code
        run: |
          GEN=$(find android/app/src/main -name MainActivity.kt | head -1)
          echo "generated MainActivity: $GEN"
          PKG=$(grep -m1 '^package ' "$GEN" | sed 's/^package //; s/[[:space:]]*$//')
          echo "package: $PKG"
          sed "s/__PACKAGE__/$PKG/" flutter_src/native/MainActivity.kt > "$GEN"
          echo "----- MainActivity.kt -----"
          cat "$GEN"

      - name: Build release APK
        run: |
          flutter pub get
          if [ -f assets/icon/logo.png ]; then
            echo "找到自訂 logo，產生 App 圖示..."
            dart run flutter_launcher_icons
          else
            echo "沒有 assets/icon/logo.png，使用預設圖示"
          fi
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photo_album_apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # 把 APK 發到 Release，手機瀏覽器可直接點連結下載安裝（免登入、免解壓縮）。
      # 固定網址：https://github.com/TTTAS/image_checking/releases/download/apk-latest/app-release.apk
      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 最新 APK（自動建置）
          body: |
            由分支 `${{ github.ref_name }}` 的 commit `${{ github.sha }}` 自動建置。
            手機直接點下面的 `app-release.apk` 即可下載安裝。
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
