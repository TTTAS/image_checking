name: Build APK

# 手動觸發，或每次 push 都自動 build
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Assemble Flutter project from flutter_src
        run: |
          flutter create --platforms=android --project-name photo_album --org com.example.photoalbum .
          cp flutter_src/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r flutter_src/lib lib

      - name: Inject photo-library permissions
        run: |
          perl -0pi -e 's/(<manifest[^>]*>)/$1\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION" \/>/' android/app/src/main/AndroidManifest.xml
          echo "----- AndroidManifest.xml -----"
          cat android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photo_album_apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
